[project]
name = "mvm"
version = "0.1.0"
description = "MVM-Lite: workload-adaptive virtual memory for decision-tree inference"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "tabulate>=0.10.0",
    "numba>=0.67.0",
    "grpcio>=1.84.0",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.84.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvm", "src/dgrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
