<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" role="img" aria-labelledby="mvm-proto-title mvm-proto-desc">
  <title id="mvm-proto-title">MVM-Lite prototype on BMv2</title>
  <desc id="mvm-proto-desc">A controller sends each flow's feature keys to a BMv2 switch holding eight leaf entries, gets back a hit or miss, runs the full decision tree on a miss, and installs or evicts leaf entries by P4Runtime writes.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- connectors first -->
  <line x1="164" y1="144" x2="220" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="424" y1="124" x2="496" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="500" y1="168" x2="428" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="284" y1="188" x2="284" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="364" y1="228" x2="364" y2="192" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <path d="M 384 100 L 384 64 Q 384 56 392 56 L 572 56 Q 580 56 580 64 L 580 96" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <!-- connector labels (masked, 6-10px gap) -->
  <rect x="168" y="124" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="192" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FLOWS</text>
  <rect x="428" y="104" width="64" height="12" rx="2" fill="#f5f5f5"/>
  <text x="460" y="113" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PACKET-OUT</text>
  <rect x="428" y="148" width="68" height="12" rx="2" fill="#f5f5f5"/>
  <text x="462" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT / CLASS</text>
  <rect x="292" y="200" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="308" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>
  <rect x="372" y="200" width="56" height="12" rx="2" fill="#f5f5f5"/>
  <text x="400" y="209" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LEAF, CLASS</text>
  <rect x="436" y="36" width="104" height="12" rx="2" fill="#f5f5f5"/>
  <text x="488" y="45" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT / DELETE</text>

  <!-- nodes -->
  <rect x="24" y="112" width="140" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="24" y="112" width="140" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
  <text x="94" y="140" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Flow stream</text>
  <text x="94" y="156" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">10 feature keys each</text>

  <rect x="224" y="100" width="200" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="224" y="100" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="232" y="108" width="28" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="246" y="117" fill="#2d3142" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">P4RT</text>
  <text x="324" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controller</text>
  <text x="324" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">decayed LFU, gamma 0.99</text>

  <rect x="224" y="228" width="200" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="224" y="228" width="200" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="324" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Full decision tree</text>
  <text x="324" y="272" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">runs only on a miss</text>

  <rect x="500" y="100" width="200" height="88" rx="6" fill="#f5f5f5"/>
  <rect x="500" y="100" width="200" height="88" rx="6" fill="#eb6c36" fill-opacity="0.10" stroke="#eb6c36" stroke-width="1"/>
  <rect x="508" y="108" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="522" y="117" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BMV2</text>
  <text x="600" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Switch leaf table</text>
  <text x="600" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">K = 8 range entries</text>

  <!-- legend strip -->
  <line x1="24" y1="304" x2="696" y2="304" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="24" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <line x1="96" y1="320" x2="120" y2="320" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="128" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">query path</text>
  <line x1="220" y1="320" x2="244" y2="320" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="252" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">result returned on a miss</text>
  <line x1="420" y1="320" x2="444" y2="320" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="452" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">table updates (P4Runtime writes)</text>
</svg>
